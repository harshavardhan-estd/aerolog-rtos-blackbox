name: AeroLog-RTOS CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  concurrency-tests:
    name: FreeRTOS Concurrency & Storage Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up GCC & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make cmake python3

      - name: Execute Automated Unit Test Suite
        run: |
          python3 tests/run_tests.py

      - name: Build and Run Host Simulator
        run: |
          cmake -B build
          cmake --build build
          ctest --test-dir build --output-on-failure
